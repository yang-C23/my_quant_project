[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-quant"
version = "0.1.0"
description = "A-share quantitative research platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "pyarrow>=16",
    "duckdb>=1.0",
    "pyqlib==0.9.7",
    "backtrader>=1.9.78.123",
    "pyyaml>=6",
    "typer>=0.12",
    "pydantic-settings>=2.4",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "pre-commit",
]

[project.scripts]
myquant = "quant.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
exclude = [
    "run_*.py",
    "scripts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring real data or external services",
]
